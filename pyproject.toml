[build-system]
requires = [
	"scikit-build-core==1.0.3",
	"pybind11-stubgen==2.5.5"
]
build-backend = "scikit_build_core.build"

[project]
name = "rexlib"
dynamic = ["version"]
authors = [
    { name = "Oier Lauzirika Zarrabeitia", email = "oierlauzi@bizkaia.eu" },
    { name = "Martin Salinas", email = "ssalinasmartin@gmail.com" }
]
description = "Python binding for the rexlib framework"
classifiers = [
	"Topic :: Scientific/Engineering :: Image Processing",
	"Intended Audience :: Science/Research",
	"Intended Audience :: Developers",
	"Operating System :: OS Independent",
	"Programming Language :: Python",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.9",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Typing :: Typed",
]

readme = {file = "README.md", content-type = "text/markdown"}
license = "GPL-3.0-only"

requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
# One plugin distribution per CUDA major, surfaced as an extra: extras
# cannot select between mutually exclusive binary builds, so each pulls a
# differently named package. Same shape as jax[cuda12].
cuda11 = ["rexlib-cuda11==0.1.*"]
cuda12 = ["rexlib-cuda12==0.1.*"]
cuda13 = ["rexlib-cuda13==0.1.*"]
test = [
	"pytest==8.4.2; python_version < '3.10'",
	"pytest==9.1.1; python_version >= '3.10'",
    "ruff==0.16.2",
]

[project.urls]
Homepage = "https://github.com/gigabit-clowns/rexlib-python"
Issues = "https://github.com/gigabit-clowns/rexlib-python/issues"

[tool.scikit-build]
cmake.version = ">=3.18"
cmake.args = []
build.verbose = false
cmake.build-type = "Release"

[tool.scikit-build.cmake.define]
BUILD_TESTING = "OFF"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = "(?P<value>\\d+\\.\\d+\\.\\d+)"

[tool.cibuildwheel]
#test-command = "{project}/scripts/run-tests.sh" # TODO add when rexlib is in PyPI
#test-extras = ["test"]
