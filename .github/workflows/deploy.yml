name: Deploy release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    branches:
      - main

  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/deploy.yml'
      - 'pyproject.toml'

  workflow_dispatch:

jobs:
  generate_stubs:
    name: Generate type stubs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - name: Set up compiler cache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: stubs-ubuntu-latest
          max-size: 1G

      - name: Install rexlib
        run: |
          python -m pip install "cmake>=3.21" ninja
          python scripts/install_rexlib.py --parallel 4 \
            --prefix "${{ runner.temp }}/rexlib"

      - name: Install with pip
        env:
          CMAKE_PREFIX_PATH: ${{ runner.temp }}/rexlib
        run: pip install . -v

      - name: Collect the generated stubs
        run: |
          mkdir -p stubs
          cp "$(python -c 'import rexlib, pathlib; print(pathlib.Path(rexlib.__file__).parent)')"/_binding/*.pyi stubs/
          ls -l stubs

      - name: Upload stubs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: type-stubs
          path: stubs/*.pyi

  build_wheels:
    needs: generate_stubs
    name: Build wheels for ${{ matrix.os }} (${{ matrix.architectures }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            architectures: "x86_64"
          - os: ubuntu-24.04-arm
            architectures: "aarch64"
          - os: macos-latest
            architectures: "x86_64"
          - os: macos-latest
            architectures: "arm64"
          - os: macos-latest
            architectures: "universal2"
          - os: windows-latest
            architectures: "AMD64"
          - os: windows-latest
            architectures: "ARM64"

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download the type stubs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: type-stubs
          path: stubs

      # delvewheel resolves DLL dependencies via PATH, which never contains
      # the arm64 CRT when cross-compiling from an x64 host, so
      # msvcp140.dll is "not found" for the arm64 wheel unless it is
      # pointed there explicitly.
      # See https://github.com/adang1345/delvewheel/issues/44
      - name: Locate MSVC ARM64 redistributable (for delvewheel)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $crt = Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\arm64\Microsoft.VC*.CRT" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $crt) { $crt = $env:RUNNER_TEMP }
          Add-Content -Path $env:GITHUB_ENV -Value "ARM64_CRT_DIR=$crt"

      # macOS builds run on the runner itself, so the usual setup applies.
      # Windows is left out: ccache with MSVC needs the debug information
      # format pinned, and the build degrades to an uncached one anyway.
      - name: Set up compiler cache (macOS)
        if: runner.os == 'macOS'
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: wheels-${{ matrix.os }}-${{ matrix.architectures }}
          max-size: 2G

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        env:
          CIBW_ARCHS: "${{ matrix.architectures }}"
          # rexlib is built and installed once per platform, before any
          # wheel, so each interpreter only compiles the binding. Building
          # it per wheel took ~22 minutes each and ran the x86_64 job into
          # GitHub's six hour ceiling.
          CIBW_BEFORE_ALL: >
            python -m pip install "cmake>=3.21" ninja &&
            python {project}/scripts/install_rexlib.py --parallel 4 --prefix /tmp/rexlib
          CIBW_BEFORE_ALL_WINDOWS: >
            python -m pip install "cmake>=3.21" ninja &&
            python {project}/scripts/install_rexlib.py --parallel 4 --prefix C:/rexlib
          # The build picks up ccache by itself when it finds one, so
          # nothing here forces a compiler launcher: doing that would make
          # every compile fail outright wherever ccache is missing.
          #
          # A platform-specific value replaces the general one rather than
          # adding to it, so the shared part is repeated.
          CIBW_ENVIRONMENT: >-
            SKBUILD_CMAKE_DEFINE="REXLIB_STUBS_DIR=stubs"
            CMAKE_PREFIX_PATH=/tmp/rexlib
          CIBW_ENVIRONMENT_WINDOWS: >-
            SKBUILD_CMAKE_DEFINE="REXLIB_STUBS_DIR=stubs"
            CMAKE_PREFIX_PATH=C:/rexlib
          CIBW_TEST_SKIP: "*-win_arm64" # Windows on ARM cannot be tested, raises warning
          CIBW_SKIP: "cp3??t-win*" # Skip Python free-threaded builds on Windows
          # librexlib now ships inside the wheel, put there by this
          # project's install rules. auditwheel would otherwise re-vendor
          # it under a hash-mangled SONAME, which breaks find_package for
          # plugin authors and the sibling plugin directory lookup.
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
            auditwheel repair -w {dest_dir} {wheel}
            --exclude "librexlib.so*"
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >
            delocate-wheel --require-archs {delocate_archs}
            -w {dest_dir} -v {wheel}
            --ignore-missing-dependencies
          # rexlib.dll is placed beside the extension by this project's
          # own install rules; letting delvewheel vendor it would mangle
          # the name the plugin directory is resolved from.
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >
            delvewheel repair -w {dest_dir} -v {wheel}
            --exclude rexlib.dll
            --add-path "${{ env.ARM64_CRT_DIR }}"

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload_pypi:
    name: Upload to PyPI
    needs: [build_wheels, build_sdist]
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -l ./dist

      - name: Upload to PyPI # TODO enable this in the future
        if: false
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  create_developer_release:
    name: Create development release
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' && github.event.ref == 'refs/heads/main'
    env:
      TAG_NAME: "development"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download artifacs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "cibw-*"
          path: dist
          merge-multiple: true

      - name: Create or update development tag
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'action@github.com'
          git add dist
          git commit -m "Add pre-built binaries"
          git tag -fa $TAG_NAME -m 'Update development tag with main branch'
          git push origin $TAG_NAME --force

      - name: Delete all old assets from development release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view $TAG_NAME --json assets -q ".assets[].name" | while read asset; do
            gh release delete-asset $TAG_NAME "$asset" -y
          done

      - name: Create or update development release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Development build"
          body: >-
            This is an automated release containing binaries built with 
            with the head of the main branch.
          draft: false
          prerelease: true
          files: dist/**
